<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title id="pageTitle">AitorTeca - Biblioteca</title>
        <link
            rel="icon"
            href="./public/favicon/favicon.ico"
            type="image/x-icon"
        />
        <link rel="stylesheet" href="./styles/main.css" />
        <script type="module" src="./src/library.js"></script>
    </head>
    <body>
        <div class="app-layout">
            <header class="main-header">
                <div class="main-header__container container">
                    <a href="./index.html"><h1>AitorTeca</h1></a>
                    <nav class="menu">
                        <ul>
                            <li>
                                <a href="./library.html" aria-current="page"
                                    >Biblioteca</a
                                >
                            </li>
                        </ul>
                    </nav>
                </div>
            </header>
            <main class="main-content">
                <div class="container">
                    <section
                        id="bookShelf"
                        class="book-shelf"
                        aria-label="Tu biblioteca"
                        tabindex="-1"
                    ></section>
                </div>
                <div
                    id="overlayStatus"
                    class="overlay"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="overlayStatusTitle"
                >
                    <div class="overlay__modal" tabindex="-1">
                        <button
                            id="overlayStatusCloseBtn"
                            class="overlay__close"
                            aria-label="Cerrar"
                        >
                            <svg class="icon" aria-hidden="true">
                                <use href="./public/icons/icons.svg#close" />
                            </svg>
                        </button>
                        <h4 id="overlayStatusTitle" class="overlay__title">
                            Selecciona el estado:
                        </h4>
                        <div class="overlay__buttons">
                            <button
                                type="button"
                                class="btn btn--choose"
                                data-status="pending"
                            >
                                Pendiente de leer
                            </button>
                            <button
                                type="button"
                                class="btn btn--choose"
                                data-status="inProgress"
                            >
                                Leyendo
                            </button>
                            <button
                                type="button"
                                class="btn btn--choose"
                                data-status="read"
                            >
                                Leído
                            </button>
                            <button
                                type="button"
                                class="btn btn--choose"
                                data-status="notFinished"
                            >
                                Sin terminar
                            </button>
                        </div>
                    </div>
                </div>
                <div
                    id="overlayRemove"
                    class="overlay"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="overlayRemoveTitle"
                >
                    <div class="overlay__modal" tabindex="-1">
                        <button
                            id="overlayRemoveCloseBtn"
                            class="overlay__close"
                            aria-label="Cerrar"
                        >
                            <svg class="icon" aria-hidden="true">
                                <use href="./public/icons/icons.svg#close" />
                            </svg>
                        </button>
                        <h4 id="overlayRemoveTitle" class="overlay__title">
                            ¿Seguro que quieres quitar el libro de la
                            biblioteca?
                        </h4>
                        <div class="overlay__buttons">
                            <button
                                type="button"
                                class="btn btn--choose"
                                id="confirmRemoveBtn"
                            >
                                Quitar libro
                            </button>
                            <button
                                type="button"
                                class="btn btn--choose"
                                id="closeRemoveOverlayBtn"
                            >
                                Cerrar
                            </button>
                        </div>
                    </div>
                </div>
                <div
                    class="alert"
                    id="alertMessage"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                ></div>
            </main>
            <footer class="main-footer">
                <div class="container">aitorlevi.com</div>
            </footer>
            <div
                class="loader"
                id="loader"
                role="status"
                aria-label="Cargando"
            >
                <span class="spinner"></span>
            </div>
        </div>
    </body>
</html>
