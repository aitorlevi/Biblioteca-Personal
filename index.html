<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AitorTeca</title>
        <link
            rel="icon"
            href="public/favicon/favicon.ico"
            type="image/x-icon"
        />
        <link rel="stylesheet" href="styles/main.css" />
        <script type="module" src="src/app.js"></script>
    </head>
    <body>
        <div class="app-layout">
            <header class="main-header">
                <div class="main-header__container container">
                    <a href="/index.html"><h1>AitorTeca</h1></a>
                    <nav class="menu">
                        <ul>
                            <li><a href="/collection.html">Biblioteca</a></li>
                        </ul>
                    </nav>
                </div>
            </header>
            <main class="main-content">
                <div class="container">
                    <section id="form">
                        <form action="" id="formSearch" class="form-container">
                            <div class="label-input">
                                <label for="title">Titulo</label>
                                <input type="text" id="title" name="title" />
                            </div>
                            <button class="btn" type="submit">Buscar</button>
                        </form>
                    </section>
                    <section
                        id="searchResults"
                        class="search-results"
                    ></section>
                </div>
                <div class="alert" id="alertMessage"></div>
            </main>
            <footer class="main-footer">
                <div class="container">aitorlevi.com</div>
            </footer>
            <div class="loader" id="loader">
                <span class="spinner"></span>
            </div>
        </div>
    </body>
</html>
