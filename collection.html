<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title id="pageTitle">AitorTeca - Biblioteca</title>
        <link
            rel="icon"
            href="/public/favicon/favicon.ico"
            type="image/x-icon"
        />
        <link rel="stylesheet" href="styles/main.css" />
        <script type="module" src="src/collection.js"></script>
    </head>
    <body>
        <div class="app-layout">
            <header class="main-header">
                <div class="container">
                    <a href="/index.html"><h1>AitorTeca</h1></a>
                </div>
            </header>
            <main class="main-content">
                <div class="container">
                    <section id="bookShelf" class="book-shelf"></section>
                </div>
                <div id="overlayStatus" class="overlay">
                    <div class="overlay__modal">
                        <button
                            id="overlayStatusCloseBtn"
                            class="overlay__close"
                        >
                            ×
                        </button>
                        <h4 class="overlay__title">Selecciona el estado:</h4>
                        <div class="overlay__buttons">
                            <button
                                type="button"
                                class="btn btn--choose"
                                data-status="pending"
                            >
                                Pendiente de leer
                            </button>
                            <button
                                type="button"
                                class="btn btn--choose"
                                data-status="inProgress"
                            >
                                Leyendo
                            </button>
                            <button
                                type="button"
                                class="btn btn--choose"
                                data-status="read"
                            >
                                Leído
                            </button>
                            <button
                                type="button"
                                class="btn btn--choose"
                                data-status="notFinished"
                            >
                                Sin terminar
                            </button>
                        </div>
                    </div>
                </div>
                <div id="overlayRemove" class="overlay">
                    <div class="overlay__modal">
                        <button
                            id="overlayRemoveCloseBtn"
                            class="overlay__close"
                        >
                            ×
                        </button>
                        <h4 class="overlay__title">
                            ¿Seguro que quieres quitar el libro de la
                            biblioteca?
                        </h4>
                        <div class="overlay__buttons">
                            <button
                                type="button"
                                class="btn btn--choose"
                                id="confirmRemoveBtn"
                            >
                                Quitar libro
                            </button>
                            <button
                                type="button"
                                class="btn btn--choose"
                                id="closeRemoveOverlayBtn"
                            >
                                Cerrar
                            </button>
                        </div>
                    </div>
                </div>
            </main>
            <footer class="main-footer">
                <div class="container">aitorlevi.com</div>
            </footer>
        </div>
    </body>
</html>
